<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div class="card">
    <h1>Demo shop</h1>
    <p class="sub">Prices come from the shop's server. Your browser only sends which product you picked.</p>
    <form id="f">
      <h2>1. Product</h2>
      <div id="products">Loading…</div>
      <h2>2. How do you want to pay?</h2>
      <label class="item"><span><input type="radio" name="method" value="page" checked>Pay on 2C2P's payment page
        <small>You enter your card (or other method) on 2C2P's secure page.</small></span></label>
      <label class="item" id="card-option"><span><input type="radio" name="method" value="card">Pay with your own card form
        <small id="card-hint">You enter your card on this shop's page (/nonUi).</small></span></label>
      <button id="pay" type="submit" disabled>Continue</button>
    </form>
    <div id="msg"></div>
  </div>
</main>
<script>
  const f = document.getElementById('f'), btn = document.getElementById('pay'), msg = document.getElementById('msg');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  Promise.all([fetch('/api/products').then((r) => r.json()), fetch('/api/config').then((r) => r.json())]).then(([items, config]) => {
    document.getElementById('products').innerHTML = items.map((p, i) =>
      `<label class="item"><span><input type="radio" name="productId" value="${esc(p.id)}" ${i ? '' : 'checked'}>${esc(p.name)}</span><b>${esc(p.amount.toFixed(2))} ${esc(p.currencyCode)}</b></label>`).join('');
    if (!config.cardForm) { // switched off (default in production): see PACO_NONUI_CARD_FORM in .env
      const opt = document.getElementById('card-option');
      opt.classList.add('disabled'); opt.querySelector('input').disabled = true;
      document.getElementById('card-hint').textContent = 'Not available.';
    }
    btn.disabled = false;
  }).catch(() => { msg.className = 'err'; msg.textContent = 'Could not load products.'; });

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = new FormData(f), productId = data.get('productId');
    if (data.get('method') === 'card') { window.location.href = '/card?productId=' + encodeURIComponent(productId); return; }
    btn.disabled = true; msg.className = ''; msg.textContent = 'Creating payment…';
    try {
      const res = await fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId }) });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error + (out.details ? '\n' + JSON.stringify(out.details, null, 2) : ''));
      msg.textContent = 'Redirecting to the payment page…';
      window.location.href = out.paymentPageURL;
    } catch (err) { msg.className = 'err'; msg.textContent = err.message; btn.disabled = false; }
  });
</script>
</body>
</html>
